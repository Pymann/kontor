name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      aiml_release:
        description: "aiml release tag to build with (empty = newest release, else newest green aiml CI run)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build (Ubuntu 24.04) and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AIML_CACHE: ${{ github.workspace }}/__aiml_cache
      AIML_MEM_V3: "1"
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libssl-dev curl skopeo

      # The prebuilt compiler and runtime from Pymann/aiml, as a venv
      # (aiml spec/68): every exodus.json here takes $AIML and $AIML_VENV/lib.
      # Repository variable AIML_RELEASE pins a release for every run.
      # aiml with its libraries comes from kontor first: the bundle aiml's own
      # CI puts there (generic/aiml/<tag|latest>/aiml-x86_64-linux.tar.gz).
      # Secrets KONTOR_URL and KONTOR_CA, the same names as in Pymann/aiml;
      # without them, or if kontor does not answer, GitHub as before.
      - name: Download aiml
        env:
          GH_TOKEN: ${{ github.token }}
          AIML_RELEASE: ${{ github.event.inputs.aiml_release || vars.AIML_RELEASE }}
          AIML_KONTOR_URL: ${{ secrets.KONTOR_URL }}
          AIML_KONTOR_CA: ${{ secrets.KONTOR_CA }}
          AIML_KONTOR_TOKEN: ${{ secrets.AIML_KONTOR_TOKEN || secrets.KONTOR_TOKEN }}
        run: bash .github/ci/setup-aiml.sh "$RUNNER_TEMP/aimlvenv"

      # aiml spec/68 §7: the venv's compiler builds the tool itself — no
      # exodus, no Python.
      - name: Build
        run: aiml build

      # Unit tests run by the compiler (JIT); e2e, ecosystem and identity
      # against the built ./kontor, not `aiml kontor.aiml --`.
      - name: Tests
        env:
          KONTOR_BIN: ${{ github.workspace }}/kontor
        run: bash tests/run_all.sh

      # What a venv user gets: aiml spec/68 §6 builds kontor again with the
      # venv's compiler and places bin/kontor and the @kontor package.
      - name: Install into the venv
        run: |
          aiml venv "$AIML_VENV" install kontor --path .
          aiml venv "$AIML_VENV" list
          test -x "$AIML_VENV/bin/kontor"
